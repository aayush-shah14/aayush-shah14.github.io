<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 340" role="img" aria-labelledby="title desc">
  <title id="title">Throughput per watt and training time</title>
  <desc id="desc">Phi-3 throughput per watt was 3.3 times the A100 baseline. Llama 3 training took 30 percent of the baseline time.</desc>
  <rect width="700" height="340" fill="#fff"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#243342">
    <g font-size="21" font-weight="600">
      <text x="28" y="41">Throughput per watt</text>
      <text x="28" y="210">Training time</text>
    </g>
    <g font-size="15">
      <text x="28" y="89">A100 baseline</text><text x="28" y="134">ET-SoC-1</text>
      <text x="28" y="259">Baseline</text><text x="28" y="304">Llama 3</text>
    </g>
    <rect x="158" y="71" width="124" height="24" rx="8" fill="#aebccc"/>
    <rect x="158" y="116" width="409" height="24" rx="8" fill="#446bb0"/>
    <rect x="158" y="241" width="409" height="24" rx="8" fill="#aebccc"/>
    <rect x="158" y="286" width="122.7" height="24" rx="8" fill="#b46646"/>
    <path d="M28 168H672" stroke="#dce1e6"/>
    <g font-size="16" font-weight="600">
      <text x="293" y="89">1×</text><text x="578" y="134">3.3×</text>
      <text x="578" y="259">100%</text><text x="292" y="304">30%</text>
    </g>
  </g>
</svg>
