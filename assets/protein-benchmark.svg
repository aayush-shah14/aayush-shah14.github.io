<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" role="img" aria-labelledby="title desc">
  <title id="title">Protein language model efficiency benchmark</title>
  <desc id="desc">Relative throughput per watt is 1.0 for an A100 baseline and 3.3 for a RISC-V accelerator. LoRA plus distributed training reduced training time by 70 percent.</desc>
  <rect width="760" height="420" fill="#e0f3ec"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
    <text x="34" y="40" font-size="13" fill="#525951">FIG. 02 / NORMALIZED BENCHMARK</text>
    <text x="34" y="70" font-family="Ubuntu, Arial, sans-serif" font-size="20" fill="#272c29">Efficient protein language models</text>

    <text x="34" y="120" font-size="12" fill="#525951">THROUGHPUT PER WATT</text>
    <text x="34" y="160" font-size="13" fill="#272c29">A100 baseline</text>
    <rect x="170" y="143" width="126" height="24" fill="#80b4a2"/>
    <text x="306" y="160" font-size="12" fill="#58708d">1.0×</text>
    <text x="34" y="208" font-size="13" fill="#272c29">RISC-V SoC</text>
    <rect x="170" y="191" width="416" height="24" fill="#215ba5"/>
    <text x="596" y="208" font-size="12" fill="#215ba5">3.3×</text>

    <line x1="34" y1="252" x2="726" y2="252" stroke="#9bb7d6"/>

    <text x="34" y="290" font-size="12" fill="#525951">TRAINING TIME</text>
    <text x="34" y="330" font-size="13" fill="#272c29">full baseline</text>
    <rect x="170" y="313" width="416" height="24" fill="#80b4a2"/>
    <text x="596" y="330" font-size="12" fill="#58708d">100%</text>
    <text x="34" y="378" font-size="13" fill="#272c29">LoRA + DDP</text>
    <rect x="170" y="361" width="125" height="24" fill="#157463"/>
    <text x="305" y="378" font-size="12" fill="#157463">30%</text>

    <text x="726" y="405" text-anchor="end" font-size="11" fill="#525951">LOWER IS BETTER ↑ ONLY FOR TRAINING TIME</text>
  </g>
</svg>
